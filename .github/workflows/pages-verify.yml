name: Verify deployed Pages
on:
  workflow_run:
    workflows: ['Validate and deploy Pages']
    types: [completed]
  push:
    branches: ['maintenance/pages-verify/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-verify-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/maintenance/pages-verify/')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERIFIED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      PAGES_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_COMMIT }}
          persist-credentials: false
      - name: Record verification target
        run: |
          printf 'Verified commit: %s\nPages run: %s\n' "$VERIFIED_COMMIT" "$PAGES_RUN_ID"
          test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build expected publication
        run: npm run build
      - name: Compare public Pages with the exact build
        run: node scripts/verify-pages.mjs
